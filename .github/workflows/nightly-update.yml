name: Nightly data update

# Keeps a live deployment current without needing a database that outlives a single job:
# GitHub-hosted runners are ephemeral, so `data/` (the SQLite database, MLflow's store,
# the built dataset and its reports) is round-tripped through `actions/cache` instead.
# Restoring by a prefix (`restore-keys`) and saving under a run-unique key is what makes a
# cache persist "the latest state" across scheduled runs at all: a `cache@v4` step only
# saves a new entry when its own key didn't already exist, so saving under the same fixed
# key every night would silently do nothing after the first run.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

concurrency:
  group: nightly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Set up the project
        run: make setup

      - name: Restore persisted data (SQLite DB, MLflow store, dataset, reports)
        uses: actions/cache@v4
        with:
          path: data
          key: f1cp-data-${{ github.run_id }}
          restore-keys: |
            f1cp-data-

      - name: Acquire data (bootstrap on first run, incremental afterwards)
        run: |
          if [ -f data/f1cp.db ]; then
            .venv/bin/f1cp data update
          else
            .venv/bin/f1cp data update --bootstrap
          fi

      - name: Rebuild the modelling dataset
        run: .venv/bin/f1cp dataset build

      - name: Retrain the model zoo
        run: .venv/bin/f1cp train run

      - name: Evaluate the active model
        run: .venv/bin/f1cp evaluate run

      - name: Upload the evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report-${{ github.run_id }}
          path: data/reports/
          retention-days: 30
