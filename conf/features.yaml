# ======================================================================================
# Feature engineering configuration.
#
# Every block computes values *as of* the end of a given round. Nothing in this file may
# introduce information from a later round -- the leakage test suite enforces that.
# ======================================================================================

features:
  # One row per driver per completed round.
  key_columns: [season, round, driver_id]
  target_column: champion

  blocks:
    standings:
      enabled: true
      # Points systems changed repeatedly (10-6-4-3-2-1 -> 8-point -> 25-point in 2010,
      # fastest-lap point 2019-2024, sprints from 2021). Every points feature therefore
      # gets an era-normalised twin.
      era_normalisation: true

    season_context:
      enabled: true
      # Sprint rounds award additional points and change `max_points_remaining`.
      account_for_sprints: true

    form:
      enabled: true
      windows: [3, 5]
      trend_window: 5

    rates:
      enabled: true

    qualifying:
      enabled: true
      recent_window: 3

    constructor:
      enabled: true
      teammate_head_to_head: true

    driver:
      enabled: true

    circuit:
      enabled: true
      # Minimum number of past visits before a circuit average is trusted.
      min_history_races: 2
      lookback_seasons: 10

    modern:
      # Off by default: requires FastF1/OpenF1 downloads and only covers 2018+/2023+.
      enabled: false
      min_season: 2018

  filters:
    # Seasons with very few rounds make momentum features meaningless.
    min_rounds_in_season: 5
    # Drivers who never took a start in that season carry no signal.
    exclude_non_starters: true

  # Columns carried through the pipeline for grouping/reporting but never fed to a model.
  metadata_columns:
    - season
    - round
    - driver_id
    - driver_name
    - constructor_id
    - constructor_name
    - race_date
    - circuit_id
    - status
